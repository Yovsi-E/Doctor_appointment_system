{% extends 'base.html' %}

{% block title %}Verify Two-Factor Code{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="glass-card">
        <h2 style="margin-bottom: 0.5rem; text-align: center;">Two-Factor Authentication</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 2rem;">
            Enter the 6-digit verification code from your authenticator app to complete login.
        </p>

        <form action="{{ url_for('verify_2fa') }}" method="POST" id="verify-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" id="code" name="code" required placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem; padding: 1rem;" autofocus>
            </div>

            <button type="submit" class="btn btn-accent" style="width: 100%; margin-top: 1rem;">Verify & Log In</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="{{ url_for('logout') }}" style="font-size: 0.85rem; color: var(--text-muted);">Cancel login</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('code').addEventListener('input', function() {
    if (this.value.length === 6) {
        document.getElementById('verify-form').submit();
    }
});
</script>
{% endblock %}
